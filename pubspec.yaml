name: gherkart
description: >
  A lightweight, runtime BDD framework for Dart and Flutter testing.
  Parse Gherkin .feature files at runtime with no code generation.
version: 0.3.1
repository: https://github.com/agical/gherkart
issue_tracker: https://github.com/agical/gherkart/issues
topics:
  - bdd
  - testing
  - gherkin
  - cucumber
  - flutter

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  cucumber_expressions: ^20.1.0
  cucumber_gherkin: ^43.0.0
  cucumber_messages: ^35.0.0
  meta: ^1.9.0
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  patrol_finders: ^3.0.0
  test: ^1.24.0
